name: Build & Release HHKungfu TV APK
run-name: 🚀 Release ${{ github.ref_name }} (Build APK)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK & Version Artifacts
        id: prep
        run: |
          mkdir -p release_dist
          cp app/build/outputs/apk/debug/app-debug.apk release_dist/HHKungfuTV.apk
          cp version.json release_dist/version.json
          
          # Extract version from version.json
          VERSION_NAME=$(grep -o '"versionName": "[^"]*"' version.json | cut -d'"' -f4)
          VERSION_CODE=$(grep -o '"versionCode": [0-9]*' version.json | tr -dc '0-9')
          CHANGELOG=$(grep -o '"changelog": "[^"]*"' version.json | cut -d'"' -f4)
          
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT
          echo "Tag: v$VERSION_NAME (code: $VERSION_CODE)"

      - name: Upload Build Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: HHKungfuTV-v${{ steps.prep.outputs.version_name }}
          path: release_dist/HHKungfuTV.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: HHKungfu TV ${{ github.ref_name }}
          body: |
            ### 🎬 HHKungfu TV ${{ github.ref_name }} (Build ${{ steps.prep.outputs.version_code }})
            
            **Tính năng mới & cập nhật:**
            ${{ steps.prep.outputs.changelog }}
            
            ---
            📦 **Tải trực tiếp:** [HHKungfuTV.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/HHKungfuTV.apk)
          files: |
            release_dist/HHKungfuTV.apk
            release_dist/version.json
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
